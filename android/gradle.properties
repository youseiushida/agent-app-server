# At most 3 GB for the Gradle daemon: other builds (cargo, a second Gradle) share the machine.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Compile Kotlin inside the Gradle daemon so its heap limit above bounds the whole build
# (a separate Kotlin daemon would take its own heap on top).
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
