[package]
name = "aas-daemon"
description = "agent-app-server binaries: the daemon, its watchdog, and the management CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agent-app-server"
path = "src/bin/agent-app-server.rs"

[[bin]]
name = "agent-app-server-daemon"
path = "src/bin/agent-app-server-daemon.rs"

[dependencies]
aas-adapter-acp.workspace = true
aas-adapter-claude.workspace = true
aas-adapter-codex.workspace = true
aas-adapter-fake.workspace = true
aas-adapter-pi.workspace = true
aas-core.workspace = true
aas-harness.workspace = true
aas-protocol.workspace = true
aas-server.workspace = true
aas-supervisor.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
humantime-serde.workspace = true
parking_lot.workspace = true
qrcode.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
dunce.workspace = true
futures.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
